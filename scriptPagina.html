<script>

let datosOriginales = [];
let datosMostrados = [];
let ordenActual = { col: null, asc: true };
let debounceTimer;
let guardandoRegistro = false; // Bandera para evitar múltiples guardados

// Listas de opciones cargadas al inicio
let listasOpciones = { grados: [], instituciones: [], categoriaPorInstitucion: {} };

// Calcular posiciones (puesto) maestras por grado + categoría
function computeRankings() {
  const mapa = {};
  datosOriginales.forEach(r => {
    const key = (r.grado || '') + '||' + (r.categoria || '');
    if (!mapa[key]) mapa[key] = [];
    mapa[key].push(r);
  });

  const toSegundos = s => {
    if (!s) return 0;
    const match = String(s).match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
    if (!match) return 0;
    const h = Number(match[1]) || 0;
    const m = Number(match[2]) || 0;
    const sec = Number(match[3]) || 0;
    return h * 3600 + m * 60 + sec;
  };

  Object.values(mapa).forEach(group => {
    group.sort((a, b) => {
      const parseP = v => (v === null || v === undefined || String(v).trim() === '') ? -1 : Number(v);
      const pa = parseP(a.puntaje);
      const pb = parseP(b.puntaje);
      if (pb !== pa) return pb - pa; // puntaje desc, vacíos (-1) quedan al final
      return toSegundos(a.hora) - toSegundos(b.hora); // hora asc (más temprano mejor)
    });
    group.forEach((r, i) => r.puesto = i + 1);
  });
}

function cargarPagina(nombre) {
  google.script.run
    .withSuccessHandler(html => {
      document.getElementById("contenido-principal").innerHTML = html;
      if (nombre === "pageFormulario") {
        // Cargar datos y listas de opciones al inicio
        cargarOpcionesInicial();
        setTimeout(cargarData, 50);
      }
    })
    .getPagina(nombre);
}

function cargarData() {
  google.script.run
    .withSuccessHandler(resp => {
      // Guardar filtros actuales para restaurarlos después de recargar
      const prevGrado = document.getElementById('fGrado')?.value || '';
      const prevIE = document.getElementById('fIE')?.value || '';
      const prevCat = document.getElementById('fCategoria')?.value || '';
      const prevTexto = document.getElementById('fTexto')?.value || '';

      datosOriginales = Array.isArray(resp) ? resp : [];
      datosMostrados = [...datosOriginales];

      // Calcular ranking maestro y mantener puestos aun después de filtrar
      computeRankings();

      // Orden inicial por puesto maestro
      datosMostrados.sort((a, b) => (Number(a.puesto) || 0) - (Number(b.puesto) || 0));

      // Recrear las opciones y luego restaurar los filtros seleccionados
      llenarFiltros();

      const selGrado = document.getElementById('fGrado');
      if (selGrado && [...selGrado.options].some(o => o.value === prevGrado)) selGrado.value = prevGrado;
      const selIE = document.getElementById('fIE');
      if (selIE && [...selIE.options].some(o => o.value === prevIE)) selIE.value = prevIE;
      const selCat = document.getElementById('fCategoria');
      if (selCat && [...selCat.options].some(o => o.value === prevCat)) selCat.value = prevCat;
      const fTexto = document.getElementById('fTexto');
      if (fTexto) fTexto.value = prevTexto;

      // Asegurar que el orden por defecto sea por puesto
      ordenActual.col = 'puesto';
      ordenActual.asc = true;

      // Aplicar los filtros restaurados y renderizar (ordenará por puesto)
      aplicarFiltroTexto();
      actualizarContador();
    })
    .withFailureHandler(err => console.error("Error al obtener datos:", err))
    .getAllData();
}

// ----------------------
// Filtros con debounce
// ----------------------
document.addEventListener("input", e => {
  if (e.target && e.target.id === "fTexto") {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(aplicarFiltroTexto, 300);
  }
});

function getFiltrosActivos() {
  const texto = (document.getElementById("fTexto")?.value || "").trim();
  const grado = (document.getElementById("fGrado")?.value || "").trim();
  const ie = (document.getElementById("fIE")?.value || "").trim();
  const categoria = (document.getElementById("fCategoria")?.value || "").trim();

  const activos = [];
  if (texto) activos.push("texto");
  if (grado) activos.push("grado");
  if (ie) activos.push("ie");
  if (categoria) activos.push("categoria");

  return { texto, grado, ie, categoria, activos };
}

function getOrdenDefectoSegunFiltros() {
  const { activos, texto, grado, ie, categoria } = getFiltrosActivos();
  const filtroSoloIE = activos.length === 1 && !!ie && !texto && !grado && !categoria;
  return filtroSoloIE ? "grado" : "puesto";
}

function valorGradoParaOrden(grado) {
  const texto = String(grado || "").trim().toLowerCase();
  if (!texto) return { nivel: 999, numero: 999, orden: 999999 };

  const matchNumero = texto.match(/(\d{1,2})/);
  const numero = matchNumero ? Number(matchNumero[1]) : 999;

  if (texto.includes("inicial")) return { nivel: 0, numero, orden: numero };
  if (texto.includes("prim")) return { nivel: 1, numero, orden: numero };
  if (texto.includes("sec")) return { nivel: 2, numero, orden: numero };
  if (texto.includes("pre")) return { nivel: 0, numero, orden: numero };

  return { nivel: 999, numero, orden: 999999 };
}

function aplicarFiltroTexto() {
  const texto = (document.getElementById("fTexto")?.value || "").toLowerCase().trim();
  const palabras = texto.split(/\s+/);

  datosMostrados = datosOriginales.filter(r => {
    const combinado = (r.apellidos + " " + r.nombres).toLowerCase();
    return palabras.every(palabra => combinado.includes(palabra));
  });

  // Filtros select
  const g = (document.getElementById("fGrado")?.value || "").trim();
  const ieSel = (document.getElementById("fIE")?.value || "").trim();
  const cat = (document.getElementById("fCategoria")?.value || "").trim();

  if (g || ieSel || cat) {
    datosMostrados = datosMostrados.filter(r => {
      if (g && r.grado !== g) return false;
      if (ieSel && r.ie !== ieSel) return false;
      if (cat && r.categoria !== cat) return false;
      return true;
    });
  }

  const ordenDefecto = getOrdenDefectoSegunFiltros();
  if (!ordenActual.col || ordenActual.col === "puesto" || (ordenActual.col === "grado" && ordenDefecto === "puesto")) {
    ordenActual.col = ordenDefecto;
    ordenActual.asc = true;
  }

  if (ordenActual.col) ordenar(ordenActual.col, false);
  else renderTabla(datosMostrados);
}

function renderTabla(array) {
  const tbody = document.getElementById("tbodyParticipantes");
  if (!tbody) return;

  const cont = document.getElementById("contador");
  if (cont)
    cont.textContent = `Mostrando ${array.length} registro${array.length !== 1 ? "s" : ""}`;

  // Limpiar sin forzar reflow
  tbody.innerHTML = "";

  // Usar fragment para evitar miles de writes al DOM
  const fragment = document.createDocumentFragment();

  array.forEach(row => {
    const tr = document.createElement("tr");

    tr.insertAdjacentHTML("beforeend", `
      <td>${escapeHtml(row.puesto)}</td>
      <td>${escapeHtml(row.apellidos)}</td>
      <td>${escapeHtml(row.nombres)}</td>
      <td>${escapeHtml(row.grado)}</td>
      <td>${escapeHtml(row.ie)}</td>
      <td>${escapeHtml(row.categoria)}</td>
      <td>${escapeHtml(row.puntaje)}</td>
      <td>${escapeHtml(row.hora)}</td>
      <td>
        <button class="btn-edit" onclick="editarRegistro('${escapeHtmlAttr(row.id)}')">✏️</button>
        <button class="btn-delete" onclick="eliminarRegistro('${escapeHtmlAttr(row.id)}')">🗑️</button>
      </td>
    `);

    fragment.appendChild(tr);
  });

  tbody.appendChild(fragment); // un solo insert → 50x más rápido
}

function llenarFiltros() {
  const selGrado = document.getElementById("fGrado");
  const selIE = document.getElementById("fIE");
  const selCat = document.getElementById("fCategoria");
  if (!selGrado || !selIE || !selCat) return;

  selGrado.innerHTML = '<option value="">Filtrar por Grado</option>';
  selIE.innerHTML = '<option value="">Filtrar por Institución</option>';
  selCat.innerHTML = '<option value="">Filtrar por Categoría</option>';

  // Usar el orden definido en la pestaña de configuración (listasOpciones.grados) si está disponible
  let grados;
  if (Array.isArray(listasOpciones.grados) && listasOpciones.grados.length) {
    grados = listasOpciones.grados.filter(x => x);
  } else {
    // Fallback: mantener el orden de aparición en los datos
    grados = [...new Set(datosOriginales.map(r => r.grado))].filter(x => x);
  }

  const ies = [...new Set(datosOriginales.map(r => r.ie))].filter(x => x).sort();
  const cats = [...new Set(datosOriginales.map(r => r.categoria))].filter(x => x).sort();

  grados.forEach(g => selGrado.innerHTML += `<option value="${escapeHtmlAttr(g)}">${escapeHtml(g)}</option>`);
  ies.forEach(i => selIE.innerHTML += `<option value="${escapeHtmlAttr(i)}">${escapeHtml(i)}</option>`);
  cats.forEach(c => selCat.innerHTML += `<option value="${escapeHtmlAttr(c)}">${escapeHtml(c)}</option>`);

  selGrado.onchange = aplicarFiltros;
  selIE.onchange = aplicarFiltros;
  selCat.onchange = aplicarFiltros;
}

function aplicarFiltros() {
  aplicarFiltroTexto();
}

function resetFiltros() {
  ["fGrado","fIE","fCategoria","fTexto"].forEach(id => document.getElementById(id).value="");
  datosMostrados = [...datosOriginales];
  ordenActual.col = "puesto";
  ordenActual.asc = true;
  ordenar("puesto", false);
}

function ordenar(col, toggle = true) {
  if (toggle) {
    if (ordenActual.col !== col) {
      ordenActual.col = col;
      ordenActual.asc = true;
    } else {
      ordenActual.asc = !ordenActual.asc;
    }
  }

  datosMostrados.sort((a, b) => {
    let va = a[col] ?? "";
    let vb = b[col] ?? "";

    // Ordenar por puntaje numérico (si empatan, usar el puesto maestro como desempate)
    if (col === "puntaje") {
      const parseP = v => (v === null || v === undefined || String(v).trim() === '') ? -1 : Number(v);
      va = parseP(va);
      vb = parseP(vb);
      if (va !== vb) return ordenActual.asc ? va - vb : vb - va;

      const pa = Number(a.puesto) || 999999;
      const pb = Number(b.puesto) || 999999;
      return pa - pb;
    }

    // Ordenar por hora (h:m:s)
    if (col === "hora") {
      const toSegundos = s => {
        if (!s) return 0;
        const match = s.match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/); // acepta 1 o 2 dígitos
        if (!match) return 0;
        const h = Number(match[1]) || 0;
        const m = Number(match[2]) || 0;
        const sec = Number(match[3]) || 0;
        return h * 3600 + m * 60 + sec; // convertir todo a segundos
      };
      va = toSegundos(va);
      vb = toSegundos(vb);
      return ordenActual.asc ? va - vb : vb - va;
    }

    // Ordenar por puesto (numérico)
    if (col === "puesto") {
      va = Number(va) || 0;
      vb = Number(vb) || 0;
      return ordenActual.asc ? va - vb : vb - va;
    }

    // Ordenar por grado con prioridad por etapa y número del curso
    if (col === "grado") {
      const ga = valorGradoParaOrden(va);
      const gb = valorGradoParaOrden(vb);
      if (ga.nivel !== gb.nivel) return ordenActual.asc ? ga.nivel - gb.nivel : gb.nivel - ga.nivel;
      if (ga.numero !== gb.numero) return ordenActual.asc ? ga.numero - gb.numero : gb.numero - ga.numero;
      return ordenActual.asc
        ? String(va).localeCompare(String(vb), undefined, { numeric: true })
        : String(vb).localeCompare(String(va), undefined, { numeric: true });
    }

    // Orden alfabético/numerico por defecto
    return ordenActual.asc
      ? String(va).localeCompare(String(vb), undefined, { numeric: true })
      : String(vb).localeCompare(String(va), undefined, { numeric: true });
  });

  renderTabla(datosMostrados);
}


function actualizarContador() {
  const cont = document.getElementById("contador");
  if (!cont) return;
  cont.textContent = `Mostrando ${datosMostrados.length} registro${datosMostrados.length !== 1 ? "s" : ""}`;
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function escapeHtmlAttr(str){ return escapeHtml(str).replace(/"/g,"&quot;"); }

// ----------------------
// Modal y edición
// ----------------------
function abrirModal() {
  limpiarModal();
  const modal = document.getElementById("modalAgregar");
  modal.removeAttribute("data-edit-id");
  modal.style.display = "flex";

  // ID solo para nuevo registro
  const nuevoId =  getFechaHoraString() + "_" + generarPrefijoAleatorio() ;
  document.getElementById("mId").value = nuevoId;
  document.getElementById("mId").disabled = true;

  // Llenar selects instantáneos desde listas cargadas
  aplicarListasEnModal();
}

function editarRegistro(id) {
  const fila = datosMostrados.find(r => r.id === id);
  if (!fila) { console.error("ID no encontrado:", id); return; }

  const modal = document.getElementById("modalAgregar");
  modal.setAttribute("data-edit-id", id);
  modal.style.display = "flex";

  document.getElementById("mId").value = fila.id;
  document.getElementById("mId").disabled = true;
  document.getElementById("mApellidos").value = fila.apellidos;
  document.getElementById("mNombres").value = fila.nombres;
  document.getElementById("mPuntaje").value = fila.puntaje;

  if (fila.hora) {
    const partes = fila.hora.split(":");
    document.getElementById("hora").value = partes[0]?.padStart(2,"0") || "";
    document.getElementById("minutos").value = partes[1]?.padStart(2,"0") || "";
    document.getElementById("segundos").value = partes[2]?.padStart(2,"0") || "";
  } else {
    document.getElementById("hora").value = "";
    document.getElementById("minutos").value = "";
    document.getElementById("segundos").value = "";
  }

  // Aplicar selects desde listas
  aplicarListasEnModal(fila);
}
function cerrarModal() {
  document.getElementById("modalAgregar").style.display="none";
  document.getElementById("modalAgregar").removeAttribute("data-edit-id");
}

function limpiarModal() {
  ["mApellidos","mNombres","mGrado","institucion","mCategoria","mPuntaje"].forEach(id => document.getElementById(id).value="");

  // Limpiar los 3 campos de hora
  ["hora","minutos","segundos"].forEach(id => document.getElementById(id).value="");
}

function guardarRegistro() {
  // Bloquear si ya se está guardando
  if (guardandoRegistro) {
    alert("Por favor espera a que termine el registro anterior");
    return;
  }

  const id = document.getElementById("mId").value;
  const apellidos = document.getElementById("mApellidos").value.trim();
  const nombres = document.getElementById("mNombres").value.trim();
  const grado = document.getElementById("mGrado").value.trim();
  const ie = document.getElementById("institucion").value.trim();
  const categoria = document.getElementById("mCategoria").value.trim();
  const puntaje = document.getElementById("mPuntaje").value || "";

  // Normalizar hora a hh:mm:ss
  const hRaw = document.getElementById("hora").value;
  const mRaw = document.getElementById("minutos").value;
  const sRaw = document.getElementById("segundos").value;
  const hora = (hRaw || mRaw || sRaw)
    ? `${hRaw.padStart(2,'0')}:${mRaw.padStart(2,'0')}:${sRaw.padStart(2,'0')}`
    : "";

  if (hora && !validarHoraEntrega(hora)) {
    alert("Validar la hora: la hora de entrega debe ser entre las 09:00 y las 19:00.");
    return;
  }

  const puntajeNum = Number(puntaje);
  if (puntaje !== "" && (!Number.isInteger(puntajeNum) || puntajeNum <= 0 || puntajeNum > 200)) {
    alert("Validar el puntaje: debe ser un número entero mayor a 0 y como máximo 200.");
    return;
  }

  const libre = isLibreInstitucion(ie);
  if (!apellidos || !nombres || !grado || !ie || (!libre && !categoria)) {
    alert("Por favor completa todos los campos obligatorios (*)");
    return;
  }

  // Establecer bandera de guardando y deshabilitar botón
  guardandoRegistro = true;
  const btnGuardar = document.querySelector("#modalAgregar button[onclick*='guardarRegistro']");
  if (btnGuardar) {
    btnGuardar.disabled = true;
    btnGuardar.style.opacity = "0.5";
    btnGuardar.style.cursor = "not-allowed";
  }

  const editId = document.getElementById("modalAgregar").getAttribute("data-edit-id");
  const registro = { id, apellidos, nombres, grado, ie, categoria, puntaje, hora };

  if(editId) {
    google.script.run
      .withSuccessHandler(() => { 
        guardandoRegistro = false;
        if (btnGuardar) {
          btnGuardar.disabled = false;
          btnGuardar.style.opacity = "1";
          btnGuardar.style.cursor = "pointer";
        }
        cerrarModal(); 
        cargarData(); 
      })
      .withFailureHandler(() => {
        guardandoRegistro = false;
        if (btnGuardar) {
          btnGuardar.disabled = false;
          btnGuardar.style.opacity = "1";
          btnGuardar.style.cursor = "pointer";
        }
      })
      .editarRegistroSheet(registro);
  } else {
    google.script.run
      .withSuccessHandler(() => { 
        guardandoRegistro = false;
        if (btnGuardar) {
          btnGuardar.disabled = false;
          btnGuardar.style.opacity = "1";
          btnGuardar.style.cursor = "pointer";
        }
        cerrarModal(); 
        cargarData(); 
      })
      .withFailureHandler(() => {
        guardandoRegistro = false;
        if (btnGuardar) {
          btnGuardar.disabled = false;
          btnGuardar.style.opacity = "1";
          btnGuardar.style.cursor = "pointer";
        }
      })
      .agregarRegistro(registro);
  }
}

function imprimirFiltrados() {
  const btn = document.getElementById('btnImprimir');
  const prevText = btn ? btn.textContent : null;
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Generando...';
  }

  const grado = (document.getElementById('fGrado')?.value || '');
  const ie = (document.getElementById('fIE')?.value || '');
  const categoria = (document.getElementById('fCategoria')?.value || '');
  const texto = (document.getElementById('fTexto')?.value || '');

  google.script.run
    .withSuccessHandler(url => {
      if (btn) {
        btn.disabled = false;
        btn.textContent = prevText;
      }
      if (url) window.open(url);
    })
    .withFailureHandler(err => {
      if (btn) {
        btn.disabled = false;
        btn.textContent = prevText;
      }
      console.error('Error generando PDF:', err);
      alert('Error al generar PDF. Revisa la consola.');
    })
    .generarRankingPdfFiltrado({ grado, ie, categoria, texto });
}

function eliminarRegistro(id) {
  if (!id) return;
  if (!confirm("¿Eliminar registro?")) return;

  google.script.run
    .withSuccessHandler(() => cargarData())
    .eliminarRegistro(id); // llama a la función de code.gs
}

// ----------------------
// Opciones cargadas al inicio
// ----------------------
function cargarOpcionesInicial() {
  google.script.run.withSuccessHandler(listas => {
    listasOpciones = listas;
    // Opcional: asignar al modal si está abierto
    aplicarListasEnModal();
  }).getOpciones();
}

function aplicarListasEnModal(fila = null) {
  const selCategoria = document.getElementById("mCategoria");
  const selGrado = document.getElementById("mGrado");
  const selIE = document.getElementById("institucion");

  selCategoria.disabled = true;
  [selCategoria, selGrado, selIE].forEach(s => s.innerHTML="");

  const agregarOpciones = (select, opciones, placeholder) => {
    const inicial = document.createElement("option");
    inicial.value = "";
    inicial.textContent = placeholder;
    select.appendChild(inicial);
    opciones.forEach(op => {
      const opt = document.createElement("option");
      opt.value = op;
      opt.textContent = op;
      select.appendChild(opt);
    });
    if (fila) {
      if (select.id === "institucion") select.value = fila.ie || "";
      if (select.id === "mCategoria") {
        const cat = String(fila.categoria || "").trim();
        select.value = cat.toUpperCase() === "LIBRE" ? "" : cat;
      }
      if (select.id === "mGrado") select.value = fila.grado || "";
    }
  };

  agregarOpciones(selIE, listasOpciones.instituciones, "Seleccione Institución...");
  agregarOpciones(selCategoria, listasOpciones.categorias, "Seleccione Categoría...");
  agregarOpciones(selGrado, listasOpciones.grados, "Seleccione Grado...");

  selIE.onchange = rellenarCategoriaDesdeIE;
  if (fila) rellenarCategoriaDesdeIE();
}

function isLibreInstitucion(ie) {
  if (!ie) return false;
  return ie.toString().trim().toUpperCase() === "LIBRE";
}

function rellenarCategoriaDesdeIE() {
  const ie = document.getElementById("institucion").value.trim();
  const selCategoria = document.getElementById("mCategoria");
  if (!selCategoria) return;

  if (isLibreInstitucion(ie)) {
    selCategoria.value = "";
    selCategoria.disabled = false;
    return;
  }

  const categoria = listasOpciones.categoriaPorInstitucion?.[ie.toUpperCase()] || "";
  if (categoria && categoria.toString().trim().toUpperCase() !== "LIBRE") {
    selCategoria.value = categoria;
  } else {
    selCategoria.value = "";
  }
  selCategoria.disabled = true;
}

// Botón actualizar opciones
// ----------------------
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("btnActualizarOpciones");
  if(btn) btn.onclick = () => cargarOpcionesInicial();
});

// ----------------------
// ID helpers
// ----------------------
function getFechaHoraString() {
  const now = new Date();
  const pad = n => n.toString().padStart(2,"0");
  return now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
}

function generarPrefijoAleatorio(length=4) {
  const chars = 'bcdfghjklmnpqrstvwxyz';
  let res = '';
  for(let i=0;i<length;i++) res += chars.charAt(Math.floor(Math.random()*chars.length));
  return res;
}

function formatoHora(input) {
  let value = input.value.replace(/\D/g, '');

  if (value.length > 6) value = value.slice(0, 6);

  let h = value.slice(0,2).padStart(2,'0');
  let m = value.slice(2,4).padStart(2,'0');
  let s = value.slice(4,6).padStart(2,'0');

  if (Number(h) > 24) h = '24';
  if (Number(m) > 59) m = '59';
  if (Number(s) > 59) s = '59';

  let result = h;
  if (m) result += ':' + m;
  if (s) result += ':' + s;

  input.value = result;
}


function moverFocus(input, siguienteId, max) {
  // Quitar todo lo que no sea número
  input.value = input.value.replace(/\D/g, '');
  
  // Validar límite
  if (input.value !== '' && Number(input.value) > max) input.value = max.toString().padStart(2,'0');

  // Si escribiste 2 dígitos, pasar al siguiente input
  if (input.value.length >= 2 && siguienteId) {
    document.getElementById(siguienteId).focus();
    document.getElementById(siguienteId).select();
  }
}

function validarHoraEntrega(hora) {
  if (!hora) return false;
  const match = hora.match(/^(\d{2}):(\d{2}):(\d{2})$/);
  if (!match) return false;

  const h = Number(match[1]);
  const m = Number(match[2]);
  const s = Number(match[3]);
  if (h < 0 || h > 23 || m < 0 || m > 59 || s < 0 || s > 59) return false;

  const segundosTotales = h * 3600 + m * 60 + s;
  const inicio = 9 * 3600; // 09:00:00
  const fin = 19 * 3600; // 19:00:00

  return segundosTotales >= inicio && segundosTotales <= fin;
}

function ponerHoraActual() {
  const now = new Date();
  document.getElementById('hora').value = String(now.getHours()).padStart(2,'0');
  document.getElementById('minutos').value = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('segundos').value = String(now.getSeconds()).padStart(2,'0');
}

function capitalizar(input) {
  input.value = input.value
    .split(' ')                     // separa por espacios
    .map(word => {
      if (word.length === 0) return '';
      return word[0].toUpperCase() + word.slice(1).toLowerCase();
    })
    .join(' ');                     // vuelve a unir
}
